<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05060b">
<title>La biblioteca · cinemática única (prototipo)</title>
<style>
  @font-face{font-family:'Fraunces';font-style:italic;font-weight:100 900;font-display:swap;src:url(../vendor/fraunces-5.3.0/fraunces-latin-full-italic.woff2) format('woff2')}
  @font-face{font-family:'Fraunces';font-style:normal;font-weight:100 900;font-display:swap;src:url(../vendor/fraunces-5.3.0/fraunces-latin-full-normal.woff2) format('woff2')}
  html,body{margin:0;height:100%;background:#05060b;color:#f3ead6;overflow:hidden;
    font-family:'Fraunces','Iowan Old Style',Georgia,serif;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none}
  #escena{display:block;position:fixed;inset:0;width:100%;height:100%;opacity:0;transition:opacity .4s ease}
  .lista #escena{opacity:1}
  /* viñeta y grano: fijos, por encima de la escena (no parpadean ni le cuestan a la placa de video) */
  .vineta,.grano{position:fixed;inset:0;pointer-events:none;z-index:1}
  .vineta{background:radial-gradient(ellipse 85% 70% at 50% 46%,transparent 52%,rgba(2,3,8,.5) 100%)}
  .grano{opacity:.03;background-size:128px 128px}
  /* nombres y etiquetas: texto real de la página, nunca parte de la imagen */
  .rotulo{position:fixed;left:0;top:0;z-index:2;text-align:center;pointer-events:none;opacity:0;transition:opacity .6s ease;white-space:nowrap;text-shadow:0 1px 5px #000,0 0 14px #000}
  .rotulo.ver{opacity:1}
  .rotulo br{display:none}
  .rotulo.angosto br{display:inline}
  .rotulo.angosto b{font-size:12px;line-height:1.15}
  .rotulo b{display:block;font-weight:500;font-size:13px;letter-spacing:.01em;color:#f3ead6}
  .rotulo i{display:block;margin-top:3px;font:600 9.5px/1 -apple-system,'Nunito',system-ui,sans-serif;font-style:normal;letter-spacing:.16em;text-transform:uppercase;color:#d9b76a}
  .toque{position:fixed;z-index:3;border:0;padding:0;background:none;cursor:pointer}
  .toque:focus-visible{outline:2px solid #d9b76a;outline-offset:2px;border-radius:6px}
  /* flechas: chicas, doradas, abajo, sin tapar el libro; el área de toque mide 48 px */
  .flecha{position:fixed;z-index:4;bottom:calc(22px + env(safe-area-inset-bottom));width:48px;height:48px;border:0;padding:0;border-radius:50%;background:none;color:#d9b76a;
    opacity:0;pointer-events:none;transition:opacity .3s ease;cursor:pointer;display:grid;place-items:center}
  .flecha.viva{pointer-events:auto}
  .flecha::before{content:'';position:absolute;inset:6px;border-radius:50%;border:1px solid rgba(217,183,106,.38);background:rgba(8,9,14,.28)}
  .flecha svg{position:relative}
  #atras{left:calc(50% - 74px)} #adelante{left:calc(50% + 26px)}
  /* el fundido del final de «Abrir» y la pantalla que hace de app en el prototipo */
  #velo{position:fixed;inset:0;z-index:5;background:#05060b;opacity:0;pointer-events:none}
  #app{position:fixed;inset:0;z-index:6;background:#05060b;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .3s ease}
  #app.ver{opacity:1;pointer-events:auto} #app.saliendo{opacity:0}
  #app p{margin:0;padding:0 32px;text-align:center;font-style:italic;color:#a9a394;font-size:15px;line-height:1.5}
  #app-atras{position:absolute;right:calc(64px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));width:44px;height:44px;border:0;background:none;color:#d9b76a;cursor:pointer;display:grid;place-items:center}
  #app .rueda{position:absolute;right:calc(14px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));width:44px;height:44px;display:grid;place-items:center;color:#6f6a5e}
  .falla{position:fixed;inset:auto 0 40% 0;text-align:center;padding:0 24px;font-style:italic;z-index:5}
</style>
<script type="importmap">
{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}
</script>
</head>
<body>
<canvas id="escena" aria-hidden="true"></canvas>
<div class="vineta"></div><div class="grano"></div>
<div class="rotulo"><b>El Libro <br>del Ahorro</b><i>Solo</i></div>
<div class="rotulo"><b>El Pacto <br>de los Dos</b><i>En pareja</i></div>
<button class="toque" type="button" aria-label="Abrir El Libro del Ahorro, para usar solo"></button>
<button class="toque" type="button" aria-label="Abrir El Pacto de los Dos, para usar en pareja"></button>
<button id="atras" class="flecha" type="button" aria-label="Volver"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
<button id="adelante" class="flecha" type="button" aria-label="Abrir el libro"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
<div id="velo"></div>
<div id="app"><button id="app-atras" type="button" aria-label="Cerrar el libro"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button><span class="rueda" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span><p>Acá se abre la app, en Hoy.<br>La flecha de arriba cierra el libro.</p></div>
<script type="module" src="./escena.js"></script>
</body>
</html>
