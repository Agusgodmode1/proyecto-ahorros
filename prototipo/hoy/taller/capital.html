<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Taller de la capital</title>
<style>@font-face{font-family:'Almendra';font-weight:700;src:url(almendra-latin-700-normal.woff2) format('woff2')}body{margin:0;background:#d9c69a}canvas{display:block;margin:10px}</style></head>
<body><canvas id="pig"></canvas><canvas id="oro"></canvas>
<script type="module">
/* Taller: dibuja la capital de Hoy (la «H») como una inicial de filigrana de códice: la letra en pan de oro apoyada
   directo sobre el papel, y alrededor un dibujo fino a pluma en la misma tinta sepia del texto (recuadro de doble raya,
   espirales, brotes y un zarcillo que corre por el margen). Sin bloques de color.
   NO corre en la app: de acá salen dos imágenes. «pig» es la tinta (fondo blanco: va multiplicada sobre el papel) y
   «oro» es el pan de oro (con transparencia, va encima). ?l=H cambia la letra. */
function azar(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const L = new URLSearchParams(location.search).get('l') || 'H', W = 440, H = 760, X0 = 96, Y0 = 150, T = 250;
function hash(x, y) { let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function ruido(x, y) { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf); const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }
function fbm(x, y, o = 4) { let s = 0, a = .5, f = 1; for (let i = 0; i < o; i++) { s += a * ruido(x * f, y * f); f *= 2; a *= .5; } return s; }
const cl = v => v < 0 ? 0 : v > 1 ? 1 : v, ss = (a, b, v) => { const t = cl((v - a) / (b - a)); return t * t * (3 - 2 * t); };
await document.fonts.load('700 100px Almendra');
const lienzo = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };
const r = azar(23);

/* la letra */
const mL = lienzo(), gl = mL.getContext('2d'); gl.fillStyle = '#fff'; gl.textAlign = 'center'; gl.textBaseline = 'alphabetic'; gl.font = '700 236px Almendra';
const med = gl.measureText(L); gl.fillText(L, X0 + T / 2, Y0 + T / 2 + (med.actualBoundingBoxAscent - med.actualBoundingBoxDescent) / 2);
const Lm = gl.getImageData(0, 0, W, H).data, al = (D, x, y) => (x < 0 || y < 0 || x >= W || y >= H) ? 0 : D[(y * W + x) * 4 + 3] / 255;
const cerca = (D, x, y, rad) => { let m = 0; for (let j = -rad; j <= rad; j++) for (let i = -rad; i <= rad; i++) if (i * i + j * j <= rad * rad) m = Math.max(m, al(D, x + i, y + j)); return m; };

/* ---- la filigrana a pluma: se dibuja en negro sobre transparente; después se le da el color y la carga de la tinta ---- */
const cF = lienzo(), g = cF.getContext('2d'); g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#000'; g.fillStyle = '#000';
/* un trazo de plumín: una curva que engrosa en el medio y afina en las puntas */
function trazo(pts, grosor) {
  const n = 46, P = [];
  for (let i = 0; i <= n; i++) { const t = i / n, s = pts.length / 2 - 1, k = Math.min(s - 1, Math.floor(t * s)), u = t * s - k, i0 = k * 2; const p0 = [pts[Math.max(0, i0 - 2)], pts[Math.max(1, i0 - 1)]], p1 = [pts[i0], pts[i0 + 1]], p2 = [pts[i0 + 2], pts[i0 + 3]], p3 = [pts[Math.min(pts.length - 2, i0 + 4)], pts[Math.min(pts.length - 1, i0 + 5)]];
    const cr = (a, b, c, d) => .5 * ((2 * b) + (-a + c) * u + (2 * a - 5 * b + 4 * c - d) * u * u + (-a + 3 * b - 3 * c + d) * u * u * u); P.push([cr(p0[0], p1[0], p2[0], p3[0]), cr(p0[1], p1[1], p2[1], p3[1])]); }
  for (let i = 0; i < n; i++) { const t = (i + .5) / n; g.lineWidth = Math.max(.9, grosor * 1.45 * Math.pow(Math.sin(Math.PI * t), .7)) * (.86 + r() * .28); g.beginPath(); g.moveTo(P[i][0], P[i][1]); g.lineTo(P[i + 1][0], P[i + 1][1]); g.stroke(); }
}
/* una espiral de enredadera, que nace en (x,y) y se enrosca */
function espiral(x, y, R, vueltas, giro, a0, grosor) {
  const pts = []; const n = Math.ceil(vueltas * 14);
  for (let i = 0; i <= n; i++) { const t = i / n, a = a0 + giro * t * vueltas * 6.283, rad = R * Math.pow(1 - t, 1.25) + 1.2; pts.push(x + Math.cos(a) * rad, y + Math.sin(a) * rad); }
  /* el centro de la espiral: de ahí se mide el radio; el trazo arranca afuera y termina en un brote */
  trazo(pts, grosor); const fx = pts[pts.length - 2], fy = pts[pts.length - 1]; g.beginPath(); g.arc(fx, fy, grosor * 1.25, 0, 7); g.fill();
}
function brote(x, y, a, s) { g.save(); g.translate(x, y); g.rotate(a); g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(s * .45, -s * .42, s, 0); g.quadraticCurveTo(s * .45, s * .42, 0, 0); g.fill(); g.restore(); }
function raya(x0, y0, x1, y1, grosor) { const n = 30; for (let i = 0; i < n; i++) { const a = i / n, b = (i + 1) / n, bam = (t) => (fbm(t * 7 + x0, y0 * .1, 2) - .5) * 1.6; g.lineWidth = grosor * (.8 + r() * .4); g.beginPath(); const dx = x1 - x0, dy = y1 - y0, L2 = Math.hypot(dx, dy), nx = -dy / L2, ny = dx / L2; g.moveTo(x0 + dx * a + nx * bam(a), y0 + dy * a + ny * bam(a)); g.lineTo(x0 + dx * b + nx * bam(b), y0 + dy * b + ny * bam(b)); g.stroke(); } }
const c0 = X0, c1 = X0 + T, f0 = Y0, f1 = Y0 + T;
/* el recuadro: doble raya de pluma, la de afuera más gruesa */
for (const [d, gr] of [[0, 2.6], [7, 1.2]]) { raya(c0 + d, f0 + d, c1 - d, f0 + d, gr); raya(c1 - d, f0 + d, c1 - d, f1 - d, gr); raya(c1 - d, f1 - d, c0 + d, f1 - d, gr); raya(c0 + d, f1 - d, c0 + d, f0 + d, gr); }
/* adentro: espirales que llenan el campo detrás de la letra */
const dentro = [[c0 + 62, f0 + 62, 46, 2.1, 1, 2.4], [c1 - 62, f0 + 62, 46, 2.1, -1, .7], [c0 + 62, f1 - 62, 46, 2.1, -1, -2.4], [c1 - 62, f1 - 62, 46, 2.1, 1, -.7],
  [c0 + T / 2, f0 + 36, 26, 1.7, 1, 1.57], [c0 + T / 2, f1 - 36, 26, 1.7, -1, -1.57], [c0 + 32, f0 + T / 2, 22, 1.6, -1, 3.14], [c1 - 32, f0 + T / 2, 22, 1.6, 1, 0],
  [c0 + 112, f0 + 96, 20, 1.5, 1, 4], [c1 - 112, f1 - 96, 20, 1.5, 1, 1], [c1 - 108, f0 + 100, 18, 1.4, -1, 5.4], [c0 + 108, f1 - 100, 18, 1.4, -1, 2.2]];
for (const [x, y, R, v, s, a] of dentro) espiral(x, y, R, v, s, a, 1.5);
for (let i = 0; i < 60; i++) { const x = c0 + 14 + r() * (T - 28), y = f0 + 14 + r() * (T - 28); g.beginPath(); g.arc(x, y, 1 + r() * .9, 0, 7); g.fill(); }
/* afuera: el zarcillo que sube y baja por el margen, con espirales y brotes, y unos rayitos en las esquinas */
trazo([c0 + 4, f0, c0 - 16, f0 - 34, c0 + 22, f0 - 66, c0 - 4, f0 - 100, c0 - 22, f0 - 124, c0 + 4, f0 - 138], 2.4);
espiral(c0 + 30, f0 - 60, 22, 1.6, 1, 2.8, 1.5); espiral(c0 - 30, f0 - 92, 18, 1.5, -1, .2, 1.4); brote(c0 + 4, f0 - 138, -1.2, 16); brote(c0 - 14, f0 - 34, 3.4, 13);
trazo([c0 + 4, f1, c0 - 20, f1 + 44, c0 + 30, f1 + 92, c0 - 2, f1 + 150, c0 - 26, f1 + 196, c0 + 12, f1 + 248, c0 + 34, f1 + 282, c0 + 6, f1 + 318], 2.7);
espiral(c0 + 40, f1 + 78, 26, 1.7, -1, -2.6, 1.6); espiral(c0 - 36, f1 + 138, 22, 1.6, 1, 0, 1.5); espiral(c0 + 44, f1 + 232, 22, 1.6, -1, 3.2, 1.5); espiral(c0 - 24, f1 + 286, 16, 1.4, 1, .4, 1.3);
brote(c0 + 6, f1 + 318, 1.9, 18); brote(c0 - 22, f1 + 56, 2.6, 14); brote(c0 + 24, f1 + 170, -.3, 14); brote(c0 - 12, f1 + 218, 3.3, 13);
trazo([c1, f0 + 2, c1 + 30, f0 - 16, c1 + 44, f0 + 12, c1 + 26, f0 + 26], 1.8); brote(c1 + 26, f0 + 26, 2.4, 11);
trazo([c1, f1 - 2, c1 + 34, f1 + 14, c1 + 40, f1 - 18, c1 + 22, f1 - 26], 1.8); brote(c1 + 22, f1 - 26, -2.2, 11);
for (const [x, y] of [[c1 + 12, f0 - 12], [c1 + 14, f1 + 12], [c0 - 12, f0 + 60], [c0 - 12, f0 + 190]]) for (let k = 0; k < 3; k++) { g.beginPath(); g.arc(x + (k - 1) * 5.5, y + (k % 2) * 4, 1.5, 0, 7); g.fill(); }
const F = g.getImageData(0, 0, W, H).data;

/* ---- capa 1: la tinta (va multiplicada sobre el papel) ---- */
const cp = document.getElementById('pig'); cp.width = W; cp.height = H; const gp = cp.getContext('2d'), ip = gp.createImageData(W, H), P = ip.data;
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
  const i = (y * W + x) * 4, aire = cerca(Lm, x, y, 6);          /* la filigrana deja libre un filo alrededor de la letra */
  /* tinta ferrogálica: sepia, más cargada en unos lugares que en otros, y apenas rojiza donde está aguada */
  let k = al(F, x, y) * (1 - aire) * (.8 + .3 * fbm(x / 22, y / 22, 3)) * (.86 + .14 * fbm(x / 3, y / 3, 2));
  /* el contorno de la letra: una raya fina que la separa del papel, y la sombra del relieve del oro */
  const l = al(Lm, x, y), cont = (cerca(Lm, x, y, 2) - l) * .9, sombra = Math.max(0, al(Lm, x - 3, y - 4) - l) * .34;
  k = cl(Math.max(k, cont, sombra));
  const aguada = 1 - k; P[i] = 255 + (52 + 30 * aguada - 255) * k; P[i + 1] = 255 + (30 + 14 * aguada - 255) * k; P[i + 2] = 255 + (14 + 6 * aguada - 255) * k; P[i + 3] = 255;
}
gp.putImageData(ip, 0, 0);

/* ---- capa 2: el pan de oro de la letra, sobre bol rojizo, y unas gotitas de oro en la filigrana ---- */
const co = document.getElementById('oro'); co.width = W; co.height = H; const go = co.getContext('2d');
const mG = lienzo(), gg2 = mG.getContext('2d'); gg2.drawImage(mL, 0, 0); gg2.fillStyle = '#fff';
for (const [x, y, R] of [[c0 + 62, f0 + 62, 5], [c1 - 62, f0 + 62, 5], [c0 + 62, f1 - 62, 5], [c1 - 62, f1 - 62, 5], [c0 + 30, f0 - 60, 4.4], [c0 + 40, f1 + 78, 4.8], [c0 - 36, f1 + 138, 4.4], [c0 + 44, f1 + 232, 4.4]]) { gg2.beginPath(); gg2.arc(x, y, R, 0, 7); gg2.fill(); }
const G = gg2.getImageData(0, 0, W, H).data, io = go.createImageData(W, H), O = io.data;
const grietas = lienzo(), gg = grietas.getContext('2d'); gg.strokeStyle = '#fff';
for (let q = 0; q < 40; q++) { let x = X0 + r() * T, y = Y0 + r() * T; gg.lineWidth = .5 + r() * .7; gg.beginPath(); gg.moveTo(x, y); for (let k = 0; k < 5; k++) { x += (r() - .5) * 22; y += (r() - .5) * 22; gg.lineTo(x, y); } gg.stroke(); }
const Gr = gg.getImageData(0, 0, W, H).data;
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
  const i = (y * W + x) * 4, oro = al(G, x, y);
  if (oro < .02) { O[i + 3] = 0; continue; }
  /* la hoja: bruñida (bandas de luz en diagonal), con zonas apagadas, grietas finas y saltaduras que dejan ver el bol.
     Arriba a la izquierda recibe la luz; abajo a la derecha queda en sombra (el oro va levantado sobre yeso) */
  const bru = Math.pow(.5 + .5 * Math.sin((x * .62 + y) / 27 + fbm(x / 60, y / 60, 2) * 4), 3), mate = fbm(x / 22, y / 22, 3), gri = al(Gr, x, y) * .5, salta = ss(.72, .79, fbm(x / 7 + 3, y / 7, 3)) * .85;
  const filoLuz = Math.max(0, oro - al(G, x - 2, y - 2)), filoSombra = Math.max(0, oro - al(G, x + 2, y + 2));
  let R = 158 + 78 * bru + 26 * (mate - .5), Gc = 112 + 92 * bru + 24 * (mate - .5), B = 30 + 98 * bru;
  R *= 1 - gri * .5; Gc *= 1 - gri * .55; B *= 1 - gri * .6;
  R = R + (112 - R) * salta; Gc = Gc + (44 - Gc) * salta; B = B + (26 - B) * salta;
  R = R + (255 - R) * filoLuz * .7; Gc = Gc + (240 - Gc) * filoLuz * .7; B = B + (190 - B) * filoLuz * .7;
  R *= 1 - filoSombra * .55; Gc *= 1 - filoSombra * .6; B *= 1 - filoSombra * .65;
  O[i] = cl(R / 255) * 255; O[i + 1] = cl(Gc / 255) * 255; O[i + 2] = cl(B / 255) * 255; O[i + 3] = cl(oro) * 255;
}
go.putImageData(io, 0, 0);
/* dónde está el recuadro dentro de la imagen (para acomodarla en la página) */
window.__capas = { pig: cp.toDataURL('image/png'), oro: co.toDataURL('image/png'), caja: { w: W, h: H, x0: X0, y0: Y0, lado: T } };
document.body.classList.add('lista');
</script></body></html>
