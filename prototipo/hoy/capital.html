<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Taller de la capital iluminada</title>
<style>@font-face{font-family:'Charm';font-weight:700;src:url(fuentes/charm-latin-700-normal.woff2) format('woff2')}body{margin:0;background:#d9c69a}canvas{display:block;margin:10px}</style></head>
<body><canvas id="pig"></canvas><canvas id="oro"></canvas>
<script type="module">
/* Taller: pinta la capital iluminada de Hoy (la «H») como una miniatura de manuscrito. NO corre en la app: de acá salen
   dos imágenes. «pig» es el pigmento (fondo blanco, va multiplicado sobre el papel, así el papel se ve a través) y
   «oro» es el pan de oro (con transparencia, va encima). ?l=H cambia la letra. */
function azar(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const L = new URLSearchParams(location.search).get('l') || 'H', W = 360, H = 520, X0 = 40, Y0 = 34, T = 280;
function hash(x, y) { let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function ruido(x, y) { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf); const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }
function fbm(x, y, o = 4) { let s = 0, a = .5, f = 1; for (let i = 0; i < o; i++) { s += a * ruido(x * f, y * f); f *= 2; a *= .5; } return s; }
const cl = v => v < 0 ? 0 : v > 1 ? 1 : v, ss = (a, b, v) => { const t = cl((v - a) / (b - a)); return t * t * (3 - 2 * t); };
await document.fonts.load('700 100px Charm');
const lienzo = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };
const r = azar(19);

/* ---- máscaras dibujadas a mano alzada ---- */
/* la enredadera («bianchi girari»): tallos que quedan sin pintar, del color del papel */
const mV = lienzo(), gv = mV.getContext('2d'); gv.lineCap = 'round'; gv.lineJoin = 'round'; gv.strokeStyle = '#fff'; gv.fillStyle = '#fff';
function tallo(pts, w) { gv.lineWidth = w; gv.beginPath(); gv.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 6) gv.bezierCurveTo(pts[i], pts[i + 1], pts[i + 2], pts[i + 3], pts[i + 4], pts[i + 5]); gv.stroke(); }
function hoja(x, y, a, s) { gv.save(); gv.translate(x, y); gv.rotate(a); gv.beginPath(); gv.moveTo(0, 0); gv.quadraticCurveTo(s * .5, -s * .45, s, 0); gv.quadraticCurveTo(s * .5, s * .45, 0, 0); gv.fill(); gv.restore(); }
const c0 = X0, c1 = X0 + T, f0 = Y0, f1 = Y0 + T;
tallo([c0 + 26, f1 - 20, c0 + 10, f1 - 92, c0 + 62, f1 - 104, c0 + 44, f1 - 160, c0 + 30, f0 + 76, c0 + 16, f0 + 40, c0 + 52, f0 + 26, c0 + 78, f0 + 16, c0 + 104, f0 + 30, c0 + 96, f0 + 50], 6.5);
tallo([c1 - 26, f0 + 20, c1 - 10, f0 + 92, c1 - 62, f0 + 104, c1 - 44, f0 + 160, c1 - 30, f1 - 76, c1 - 16, f1 - 40, c1 - 52, f1 - 26, c1 - 78, f1 - 16, c1 - 104, f1 - 30, c1 - 96, f1 - 50], 6.5);
tallo([c0 + 44, f1 - 160, c0 + 70, f1 - 168, c0 + 78, f1 - 140, c0 + 62, f1 - 132], 4.6); tallo([c1 - 44, f0 + 160, c1 - 70, f0 + 168, c1 - 78, f0 + 140, c1 - 62, f0 + 132], 4.6);
tallo([c0 + 16, f0 + 40, c0 + 4, f0 + 22, c0 + 26, f0 + 8, c0 + 36, f0 + 22], 4.4); tallo([c1 - 16, f1 - 40, c1 - 4, f1 - 22, c1 - 26, f1 - 8, c1 - 36, f1 - 22], 4.4);
hoja(c0 + 50, f1 - 108, -.5, 26); hoja(c0 + 30, f0 + 78, 2.5, 24); hoja(c0 + 96, f0 + 50, 1.2, 22); hoja(c0 + 62, f1 - 132, .9, 18);
hoja(c1 - 50, f0 + 108, 2.64, 26); hoja(c1 - 30, f1 - 78, -.64, 24); hoja(c1 - 96, f1 - 50, -1.94, 22); hoja(c1 - 62, f0 + 132, -2.24, 18);
/* el zarcillo que baja por el margen, a pluma */
const mZ = lienzo(), gz = mZ.getContext('2d'); gz.lineCap = 'round'; gz.strokeStyle = '#fff'; gz.fillStyle = '#fff';
gz.lineWidth = 2.6; gz.beginPath(); gz.moveTo(c0 + 20, f1 + 2); gz.bezierCurveTo(c0 - 22, f1 + 60, c0 + 62, f1 + 96, c0 + 18, f1 + 150); gz.bezierCurveTo(c0 - 6, f1 + 180, c0 + 30, f1 + 198, c0 + 40, f1 + 178); gz.stroke();
gz.lineWidth = 1.8; gz.beginPath(); gz.moveTo(c0 + 26, f1 + 78); gz.bezierCurveTo(c0 + 60, f1 + 70, c0 + 72, f1 + 96, c0 + 52, f1 + 104); gz.stroke();
gz.beginPath(); gz.moveTo(c0 + 4, f1 + 44); gz.bezierCurveTo(c0 - 22, f1 + 40, c0 - 26, f1 + 64, c0 - 10, f1 + 68); gz.stroke();
for (const [x, y, a, s] of [[c0 + 52, f1 + 104, .6, 17], [c0 - 10, f1 + 68, 2.2, 15], [c0 + 40, f1 + 178, -1.1, 16], [c0 + 30, f1 + 128, -.4, 13]]) { gz.save(); gz.translate(x, y); gz.rotate(a); gz.beginPath(); gz.moveTo(0, 0); gz.quadraticCurveTo(s * .5, -s * .5, s, 0); gz.quadraticCurveTo(s * .5, s * .5, 0, 0); gz.fill(); gz.restore(); }
/* la letra */
const mL = lienzo(), gl = mL.getContext('2d'); gl.fillStyle = '#fff'; gl.textAlign = 'center'; gl.textBaseline = 'alphabetic'; gl.font = '700 268px Charm';
const med = gl.measureText(L); gl.fillText(L, X0 + T / 2 - 4, Y0 + T / 2 + (med.actualBoundingBoxAscent - med.actualBoundingBoxDescent) / 2);
const A = (c) => c.getContext('2d').getImageData(0, 0, W, H).data, V = A(mV), Z = A(mZ), Lm = A(mL);
const al = (D, x, y) => (x < 0 || y < 0 || x >= W || y >= H) ? 0 : D[(y * W + x) * 4 + 3] / 255;
/* cuánto hay de máscara alrededor (para contornos y sombras) */
const cerca = (D, x, y, rad) => { let m = 0; for (let j = -rad; j <= rad; j++) for (let i = -rad; i <= rad; i++) if (i * i + j * j <= rad * rad) m = Math.max(m, al(D, x + i, y + j)); return m; };

/* ---- capa 1: el pigmento (va multiplicado sobre el papel) ---- */
const cp = document.getElementById('pig'); cp.width = W; cp.height = H; const gp = cp.getContext('2d'), ip = gp.createImageData(W, H), P = ip.data;
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
  const i = (y * W + x) * 4, bamb = (fbm(x / 26, y / 26, 3) - .5) * 7 + (fbm(x / 6, y / 6, 2) - .5) * 2.4;
  const dx = Math.min(x - X0, X0 + T - x) + bamb, dy = Math.min(y - Y0, Y0 + T - y) + bamb, dd = Math.min(dx, dy);
  let cub = ss(-1, 1.6, dd);                                           /* el recuadro, de borde irregular */
  const v = al(V, x, y), letra = cerca(Lm, x, y, 3);
  /* lapislázuli molido: desparejo, con el pigmento juntado en los bordes y poros donde no agarró */
  const dens = .72 + .36 * fbm(x / 34, y / 34, 4) + .12 * (fbm(x / 3, y / 3, 2) - .5) + .2 * ss(9, 0, dd), poro = ss(.76, .86, fbm(x / 2.2 + 9, y / 2.2, 2)) * .55;
  let k = cub * cl(dens) * (1 - poro) * (1 - v);
  let R = 255 + (30 - 255) * k, G = 255 + (46 - 255) * k, B = 255 + (104 - 255) * k;
  /* contorno a pluma de los tallos, y del recuadro */
  const cont = cub * Math.max(0, cerca(V, x, y, 2) - v) * .8 + ss(2.6, .6, Math.abs(dd - 1.2)) * .5 * ss(-2, 0, dd);
  R *= 1 - cont * .82; G *= 1 - cont * .86; B *= 1 - cont * .9;
  /* el zarcillo del margen: tinta sepia, con el trazo desparejo */
  const z = al(Z, x, y) * (.72 + .28 * fbm(x / 5, y / 5, 2));
  R = R + (58 - R) * z; G = G + (34 - G) * z; B = B + (16 - B) * z;
  P[i] = R; P[i + 1] = G; P[i + 2] = B; P[i + 3] = 255;
}
gp.putImageData(ip, 0, 0);
/* puntitos de bermellón y verde entre los tallos, como en las miniaturas */
for (const [x, y, c] of [[c0 + 34, f1 - 128, '#8a2a1c'], [c1 - 34, f0 + 128, '#8a2a1c'], [c0 + 62, f0 + 40, '#35603f'], [c1 - 62, f1 - 40, '#35603f'], [c0 + 24, f0 + 24, '#8a2a1c'], [c1 - 24, f1 - 24, '#8a2a1c']]) { gp.globalAlpha = .85; gp.fillStyle = c; gp.beginPath(); gp.arc(x, y, 4.2, 0, 7); gp.fill(); }
gp.globalAlpha = 1;

/* ---- capa 2: el pan de oro (letra y filete), sobre bol rojizo ---- */
const co = document.getElementById('oro'); co.width = W; co.height = H; const go = co.getContext('2d'), io = go.createImageData(W, H), O = io.data;
const grietas = lienzo(), gg = grietas.getContext('2d'); gg.strokeStyle = '#fff';
for (let q = 0; q < 46; q++) { let x = X0 + r() * T, y = Y0 + r() * T; gg.lineWidth = .5 + r() * .7; gg.beginPath(); gg.moveTo(x, y); for (let k = 0; k < 5; k++) { x += (r() - .5) * 22; y += (r() - .5) * 22; gg.lineTo(x, y); } gg.stroke(); }
const Gr = A(grietas);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
  const i = (y * W + x) * 4, bamb = (fbm(x / 26, y / 26, 3) - .5) * 7 + (fbm(x / 6, y / 6, 2) - .5) * 2.4;
  const dx = Math.min(x - X0, X0 + T - x) + bamb, dy = Math.min(y - Y0, Y0 + T - y) + bamb, dd = Math.min(dx, dy);
  const filete = ss(3.2, 4.6, dd) * ss(11.5, 10, dd) * (.9 + .1 * fbm(x / 9, y / 9, 2));
  const l = al(Lm, x, y), oro = Math.max(l, filete);
  /* sombra del relieve: el oro va sobre yeso, queda apenas levantado */
  const sombra = Math.max(al(Lm, x - 2, y - 3), 0) * (1 - l) * .5, borde = (cerca(Lm, x, y, 1) - l) * .7;
  if (oro < .02 && sombra < .02 && borde < .02) { O[i + 3] = 0; continue; }
  /* la hoja: bruñida (una banda de luz en diagonal), con zonas apagadas, grietas finas y saltaduras que dejan ver el bol */
  const bru = Math.pow(.5 + .5 * Math.sin((x * .62 + y) / 31 + fbm(x / 60, y / 60, 2) * 4), 3), mate = fbm(x / 22, y / 22, 3), gri = al(Gr, x, y) * .55, salta = ss(.71, .78, fbm(x / 7 + 3, y / 7, 3)) * .9;
  let R = 168 + 70 * bru + 26 * (mate - .5), G = 122 + 86 * bru + 24 * (mate - .5), B = 34 + 96 * bru;
  R *= 1 - gri * .5; G *= 1 - gri * .55; B *= 1 - gri * .6;
  R = R + (112 - R) * salta; G = G + (44 - G) * salta; B = B + (26 - B) * salta;
  const a = Math.max(oro, sombra, borde);
  if (oro < .5) { const t = oro / .5; R = 42 + (R - 42) * t; G = 24 + (G - 24) * t; B = 10 + (B - 10) * t; }
  O[i] = cl(R / 255) * 255; O[i + 1] = cl(G / 255) * 255; O[i + 2] = cl(B / 255) * 255; O[i + 3] = cl(a) * 255;
}
go.putImageData(io, 0, 0);
window.__capas = { pig: cp.toDataURL('image/png'), oro: co.toDataURL('image/png') };
document.body.classList.add('lista');
</script></body></html>
