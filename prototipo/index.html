<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06070d">
<title>La biblioteca · prototipo 3D</title>
<style>
  html,body{margin:0;height:100%;background:#06070d;color:#f1e6cc;overflow:hidden;
    font-family:Georgia,'Times New Roman',serif;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
  #carga{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:radial-gradient(ellipse at 50% 40%,#1a1426 0%,#06070d 70%);z-index:5;transition:opacity 1.2s ease}
  #carga p{margin:0;font-style:italic;letter-spacing:.06em;opacity:.85}
  #carga .linea{width:180px;height:2px;background:#ffffff1a;border-radius:2px;overflow:hidden}
  #barra{height:100%;width:0;background:linear-gradient(90deg,#b8862e,#ffe2a6);transition:width .3s ease}
  .etq{position:fixed;left:0;top:0;font-style:italic;font-size:13px;color:#e9d3a0;opacity:0;pointer-events:none;
    text-shadow:0 1px 6px #000;white-space:nowrap;transition:opacity .8s ease;z-index:2}
  #panel{position:fixed;left:0;right:0;bottom:0;padding:22px 24px calc(26px + env(safe-area-inset-bottom));
    text-align:center;z-index:3;opacity:0;transform:translateY(16px);transition:opacity .9s ease,transform .9s ease;
    pointer-events:none;background:linear-gradient(transparent,#06070dcc 40%)}
  #panel.ver{opacity:1;transform:none;pointer-events:auto}
  #panel h1{margin:0 0 6px;font-weight:normal;font-size:24px;color:#ffe9b8}
  #panel p{margin:0 0 18px;font-style:italic;opacity:.8;font-size:15px}
  #panel button{font:inherit;font-size:16px;min-height:44px;padding:0 22px;margin:0 6px;border-radius:22px;cursor:pointer;
    border:1px solid #e9d3a066;background:#ffffff0d;color:#f1e6cc}
  #panel button.prin{background:linear-gradient(#e7c27a,#b8862e);color:#1b1206;border:0}
  #pista{position:fixed;left:0;right:0;top:calc(18px + env(safe-area-inset-top));text-align:center;font-style:italic;
    font-size:14px;opacity:0;transition:opacity 1.2s ease;z-index:2;color:#e9d3a0}
  @media (prefers-reduced-motion:reduce){#panel,#carga,.etq,#pista{transition:opacity .4s ease}}
</style>
<script type="importmap">
{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}
</script>
</head>
<body>
<div id="carga"><p>Encendiendo la lámpara…</p><div class="linea"><div id="barra"></div></div></div>
<div id="pista">Tocá un libro</div>
<div class="etq" id="e0">Modo Lobo Solitario</div>
<div class="etq" id="e1">Ahorro en Dúo</div>
<div id="panel">
  <button id="volver">Volver</button><button class="prin" id="abrir">Abrir</button></div>
<script type="module" src="./escena.js"></script>
</body>
</html>
