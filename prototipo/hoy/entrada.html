<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050302">
<title>De la cinemática a Hoy · prototipo</title>
<style>
  html,body{margin:0;height:100%;background:#050302;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
  #hoy{opacity:0;pointer-events:none}
  #hoy.viva{pointer-events:auto}
</style>
</head>
<body>
<!-- Demostración de la ronda 2: la cinemática aprobada (sin tocarle ningún movimiento) y, encima, Hoy.
     Al final de «Abrir», en vez de fundir a oscuro, la página que llena la pantalla se funde con la página de Hoy. -->
<iframe id="cine" title="La cinemática" src="about:blank"></iframe>
<iframe id="hoy" title="Hoy" src="index.html?captura=1"></iframe>
<script>
(function(){
  var Q=new URLSearchParams(location.search),manual=Q.get('reloj')==='manual',cine=document.getElementById('cine'),hoy=document.getElementById('hoy');
  cine.src='../index.html?toma='+(Q.get('toma')||'solo')+(manual?'&reloj=manual':'');
  var tramo=function(p,a,b){return Math.max(0,Math.min(1,(p-a)/(b-a)))};
  function escena(){try{return cine.contentWindow.__escena}catch(e){return null}}
  cine.addEventListener('load',function(){
    /* el fundido a oscuro y la pantalla «acá se abre la app» del prototipo de la cinemática no hacen falta: ahora cae en Hoy */
    try{var s=cine.contentDocument.createElement('style');s.textContent='#velo,#app{display:none!important}';cine.contentDocument.head.appendChild(s)}catch(e){}
  });
  function mirar(){
    var E=escena();if(!E||!E.c)return;
    var c=E.c,e=c.estado(),o=c.seg==='abrir'?(e==='app'?1:tramo(c.p,.85,1)):0;
    hoy.style.opacity=o;hoy.classList.toggle('viva',e==='app');
  }
  if(!manual)(function tic(){mirar();requestAnimationFrame(tic)})();
  /* «volver» en Hoy: el libro se cierra con la misma animación, al revés */
  addEventListener('message',function(m){if(m.data==='hoy:volver'){var E=escena();if(E&&E.c)E.c.atras()}});
  /* para sacar la secuencia cuadro a cuadro */
  window.__listo=function(){var E=escena();return !!(E&&E.c)&&hoy.contentDocument&&hoy.contentDocument.body.classList.contains('lista')};
  window.__abrir=function(){escena().c.adelante()};
  window.__paso=function(dt){escena().paso(dt);mirar();var c=escena().c;return c.estado()+' '+c.p.toFixed(2)};
})();
</script>
</body>
</html>
