<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050302">
<title>Hoy a la luz de la vela · prototipo</title>
<style>
  /* La letra elegida por Agus: Charm (cursiva de pluma). Guardada en el repo: se ve sin internet. Licencia OFL (ver fuentes/). */
  @font-face{font-family:'Charm';font-weight:400;font-display:block;src:url(fuentes/charm-latin-400-normal.woff2) format('woff2')}
  @font-face{font-family:'Charm';font-weight:700;font-display:block;src:url(fuentes/charm-latin-700-normal.woff2) format('woff2')}
  :root{
    /* tintas (el mismo significado de colores que hoy). Son el color de reserva: en pantalla cada trazo se rellena con una
       textura de tinta (más cargada en unos lugares que en otros) y se multiplica sobre el papel, así se ven sus fibras. */
    --sepia:#2a180b; --verde:#0f4229; --rojo:#6f1810; --oro-osc:#6a4a0b;
    --pluma:'Charm','Iowan Old Style',Georgia,serif;
  }
  html,body{margin:0;height:100%;background:#050302;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
  .mesa{position:fixed;inset:0;overflow:hidden;background:#050302}
  /* el fondo: una imagen quieta sacada de la escena 3D (mesa, libro, tintero y vela). Nada de 3D mientras se usa Hoy */
  #fondo{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;display:block;user-select:none;-webkit-user-select:none;pointer-events:none}
  /* el resplandor de la vela: una capa encima que solo cambia de opacidad, muy despacio */
  .resplandor{position:absolute;width:10px;height:10px;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,rgba(255,206,140,.42) 0%,rgba(255,170,90,.16) 30%,rgba(255,150,70,0) 70%);
    transform:translate(-50%,-50%) scale(var(--r,30));opacity:.5;animation:titila 5.3s ease-in-out infinite}
  @keyframes titila{0%,100%{opacity:.42}18%{opacity:.56}31%{opacity:.38}47%{opacity:.54}63%{opacity:.46}80%{opacity:.6}}
  @media (prefers-reduced-motion:reduce){.resplandor{animation:none}}

  /* la hoja: ocupa exactamente la página derecha de la imagen */
  .hoja{position:absolute;overflow:hidden;font-family:var(--pluma);font-weight:400;color:var(--sepia)}
  /* adentro vuelve a estar pintado el mismo papel (el mismo recorte de la imagen): así la tinta se puede multiplicar
     contra él, y el borde de arriba y de abajo se funde con la hoja de atrás sin que se note */
  .tinta{height:100%;box-sizing:border-box;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;background-repeat:no-repeat;
    padding:calc(var(--u)*7.4) calc(var(--u)*6.6) calc(var(--u)*10) calc(var(--u)*12);
    -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 4.5%,#000 91%,transparent 99%);mask-image:linear-gradient(180deg,transparent 0,#000 4.5%,#000 91%,transparent 99%)}
  .tinta::-webkit-scrollbar{display:none}
  /* el pautado: las rayas de plomo con que el escriba marcó los márgenes antes de escribir */
  .pauta{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.5;
    background:linear-gradient(90deg,transparent calc(var(--u)*10.2),rgba(96,70,44,.5) calc(var(--u)*10.2),rgba(96,70,44,.5) calc(var(--u)*10.2 + .7px),transparent calc(var(--u)*10.2 + .7px),transparent calc(var(--u)*10.9),rgba(96,70,44,.36) calc(var(--u)*10.9),rgba(96,70,44,.36) calc(var(--u)*10.9 + .6px),transparent calc(var(--u)*10.9 + .6px),transparent calc(var(--u)*95),rgba(96,70,44,.4) calc(var(--u)*95),rgba(96,70,44,.4) calc(var(--u)*95 + .7px),transparent calc(var(--u)*95 + .7px))}
  p,h1{margin:0}

  /* ---- la tinta ---- cada renglón es un grupo que se multiplica sobre el papel; adentro, cada palabra lleva su textura */
  .ren{mix-blend-mode:multiply}
  .ren,.ren .w,.ren b,.ren i{background-image:var(--t-sepia);background-size:160px 160px;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
  /* (el relleno de arriba y abajo es para que no se corten los rabos de la g, la p y la q) */
  .ren .w{display:inline-block;padding:.3em .06em .34em;margin:-.3em -.06em -.34em;background-position:var(--bx,0) var(--by,0);transform:translateY(var(--dy,0)) rotate(var(--g,0deg))}
  .ren{padding-bottom:.3em;margin-bottom:-.3em}
  .ren.suave,.ren.suave .w,.ren .suave{background-image:var(--t-sepia-s)}
  .ren.verde,.ren.verde .w,.ren .verde,.ren .verde .w{background-image:var(--t-verde)}
  .ren.rojo,.ren.rojo .w,.ren .rojo{background-image:var(--t-rojo)}
  /* oro: pan de oro bruñido, con el bol rojizo asomando en el filo. No se multiplica: va encima del papel */
  .oro,.oro .w{background-image:var(--t-oro);background-size:120px 120px;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;-webkit-text-stroke:.45px rgba(84,44,14,.85)}
  .oro{filter:drop-shadow(.5px .8px .3px rgba(40,20,6,.5))}
  .oro .w{display:inline-block}

  /* arriba: la fecha y tres palabras chicas */
  .cab{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:calc(var(--u)*4.3)}
  .cab .fecha{font-style:italic}
  .cab nav{display:flex;gap:calc(var(--u)*1.4)}
  .pal{all:unset;position:relative;cursor:pointer;font:inherit;padding:0 1px}
  .pal::after{content:"";position:absolute;left:-6px;right:-6px;top:50%;height:44px;transform:translateY(-50%)}
  .punto{opacity:.75}
  /* Cobrás en */
  .cobro{margin-top:calc(var(--u)*5.4);display:grid;grid-template-columns:auto 1fr;column-gap:calc(var(--u)*3);align-items:end}
  .cobro .et{grid-column:1/-1;display:flex;justify-content:space-between;font-size:calc(var(--u)*4.8)}
  .dias{font-size:calc(var(--u)*13);line-height:1.05;white-space:nowrap}
  .dias small{font-size:.5em;margin-left:.14em}
  .camino{display:block;width:100%;height:calc(var(--u)*9);margin-bottom:calc(var(--u)*1.6);mix-blend-mode:multiply}
  .adorno{display:block;width:70%;height:calc(var(--u)*6.4);margin:calc(var(--u)*3.6) auto calc(var(--u)*3.4);mix-blend-mode:multiply}
  /* Para gastar hasta el cobro: renglón con puntos de pluma */
  .renglon{display:flex;align-items:baseline;gap:calc(var(--u)*1.6);font-size:calc(var(--u)*4.8)}
  .renglon .guia{flex:1;height:calc(var(--u)*2);align-self:flex-end;margin-bottom:.32em;background:radial-gradient(circle,rgba(42,24,11,.8) 0,rgba(42,24,11,.8) .55px,transparent .9px) 0 50%/calc(var(--u)*1.7) 100% repeat-x;-webkit-background-clip:border-box;background-clip:border-box}
  .renglon b{font-weight:700;font-size:1.5em;white-space:nowrap}
  /* Hoy podés gastar: la capital iluminada, pintada */
  .hoy{margin-top:calc(var(--u)*5.6);display:flex;align-items:flex-start;gap:calc(var(--u)*.2)}
  .capital{position:relative;flex:none;width:calc(var(--u)*19.5);aspect-ratio:360/520;margin:calc(var(--u)*-2) 0 calc(var(--u)*-13) calc(var(--u)*-2.4)}
  .capital img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;-webkit-user-select:none;user-select:none}
  .capital .pig{mix-blend-mode:multiply}
  .hoy .tit{flex:1;display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-top:calc(var(--u)*3.6)}
  .hoy h1{font-weight:400;font-size:calc(var(--u)*6.5);line-height:1.1}
  .enlace{all:unset;position:relative;cursor:pointer;font:inherit;font-size:calc(var(--u)*4.8)}
  .enlace .raya{position:absolute;left:-1%;right:-1%;bottom:-.16em;height:.5em;width:102%}
  .enlace::after{content:"";position:absolute;left:-8px;right:-8px;top:50%;height:44px;transform:translateY(-50%)}
  .monto{margin:calc(var(--u)*.4) 0 0 calc(var(--u)*14.5);font-weight:700;font-size:calc(var(--u)*22.5);line-height:1.04;white-space:nowrap}
  .monto .peso{font-size:.6em;margin-right:.16em;vertical-align:.2em;font-weight:400}
  .nota{margin-top:calc(var(--u)*2.4);font-size:calc(var(--u)*4.8);line-height:1.34}
  .nota b{font-weight:700}
  /* la semana: tres trazos de pluma */
  .semana{margin-top:calc(var(--u)*3.8);display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--u)*2.2);text-align:center;font-size:calc(var(--u)*4.2)}
  .semana svg{display:block;width:100%;height:calc(var(--u)*3);margin-bottom:calc(var(--u)*.5);mix-blend-mode:multiply}
  .semana .es-hoy{font-weight:700}
  .sigue{margin-top:calc(var(--u)*5);text-align:center;font-style:italic;font-size:calc(var(--u)*4);opacity:.8}
  /* solo del prototipo */
  .probar{position:fixed;left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:10px;z-index:5;font:600 13px/1 -apple-system,system-ui,sans-serif}
  .probar button{all:unset;cursor:pointer;min-height:44px;padding:0 16px;border-radius:22px;display:grid;place-items:center;color:#e9d7ae;background:rgba(10,6,3,.72);border:1px solid rgba(233,215,174,.28)}
  html[data-captura] .probar{display:none}
</style>
</head>

<!-- la floritura de pluma que separa las secciones: trazos que engrosan y adelgazan, como los de un plumín -->

<script type="module">
/* Dónde va la imagen y dónde cae la página: la misma cuenta de recorte que usan las fotos de la estantería */
import {recorte} from '../../js/logica/recorte.js';
import {FONDOS} from './fondos.js';
const Q=new URLSearchParams(location.search),raiz=document.documentElement,img=document.getElementById('fondo'),hoja=document.getElementById('hoja'),tinta=document.getElementById('tinta'),luz=document.querySelector('.resplandor'),mesa=document.getElementById('mesa');

/* ---- las tintas: baldosas chicas de tinta despareja (más cargada en unos lugares, más aguada en otros) ---- */
function hash(x,y){let h=(Math.imul(x,374761393)+Math.imul(y,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
function ruido(x,y,p){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),m=n=>((n%p)+p)%p;const a=hash(m(xi),m(yi)),b=hash(m(xi+1),m(yi)),c=hash(m(xi),m(yi+1)),d=hash(m(xi+1),m(yi+1));return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function baldosa(base,agua,contraste){
  const N=160,c=document.createElement('canvas');c.width=c.height=N;const g=c.getContext('2d'),im=g.createImageData(N,N),d=im.data;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    /* manchas grandes (la carga de la pluma) + grano fino (la fibra que no tomó tinta) */
    const v=Math.min(1,Math.max(0,.5+contraste*((ruido(x/40,y/40,4)-.5)*1.5+(ruido(x/11,y/11,14)-.5)*.7)+ (ruido(x/2.2,y/2.2,72)>.82?-.22:0))),i=(y*N+x)*4;
    d[i]=agua[0]+(base[0]-agua[0])*v;d[i+1]=agua[1]+(base[1]-agua[1])*v;d[i+2]=agua[2]+(base[2]-agua[2])*v;d[i+3]=255}
  g.putImageData(im,0,0);return 'url('+c.toDataURL('image/png')+')'}
function baldosaOro(){
  const N=120,c=document.createElement('canvas');c.width=c.height=N;const g=c.getContext('2d'),im=g.createImageData(N,N),d=im.data;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const bru=Math.pow(.5+.5*Math.sin((x*.7+y)/19*6.283/3.2+ruido(x/30,y/30,4)*3),2.4),mate=ruido(x/9,y/9,13),salta=ruido(x/3.2,y/3.2,37)>.86?1:0,i=(y*N+x)*4;
    let R=150+92*bru+22*(mate-.5),G=106+104*bru+20*(mate-.5),B=26+104*bru;
    if(salta){R=118;G=52;B=26}
    d[i]=Math.min(255,R);d[i+1]=Math.min(255,G);d[i+2]=Math.min(255,B);d[i+3]=255}
  g.putImageData(im,0,0);return 'url('+c.toDataURL('image/png')+')'}
raiz.style.setProperty('--t-sepia',baldosa([30,16,7],[92,62,36],1));
raiz.style.setProperty('--t-sepia-s',baldosa([58,36,18],[118,88,58],.9));
raiz.style.setProperty('--t-verde',baldosa([7,52,30],[52,104,70],1));
raiz.style.setProperty('--t-rojo',baldosa([98,16,10],[150,62,44],1));
raiz.style.setProperty('--t-oro',baldosaOro());

/* ---- la mano: cada palabra queda apenas más arriba o más abajo y un pelo torcida, como escritas una por una ---- */
function azar(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function aPluma(el,semilla){
  const r=azar(semilla),quieto=el.dataset.pluma==='quieta';
  const pasar=n=>{
    if(n.nodeType===3){
      const f=document.createDocumentFragment();
      n.textContent.split(/(\s+)/).forEach(t=>{if(!t)return;if(/^\s+$/.test(t)){f.appendChild(document.createTextNode(' '));return}
        const s=document.createElement('span');s.className='w';s.textContent=t;
        s.style.setProperty('--dy',((r()-.5)*(quieto?.5:1.3)).toFixed(2)+'px');s.style.setProperty('--g',((r()-.5)*(quieto?.5:1.5)).toFixed(2)+'deg');
        s.style.setProperty('--bx',Math.round(r()*160)+'px');s.style.setProperty('--by',Math.round(r()*160)+'px');f.appendChild(s)});
      n.parentNode.replaceChild(f,n)}
    else if(n.nodeType===1&&n.tagName!=='SVG')[...n.childNodes].forEach(pasar)};
  [...el.childNodes].forEach(pasar)}
document.querySelectorAll('[data-pluma]').forEach((el,i)=>aPluma(el,17+i*7));

let actual='';
function acomodar(){
  const w=mesa.clientWidth,h=mesa.clientHeight,k=h/w>1.92?'alto':'corto',F=FONDOS[k];
  if(k!==actual){actual=k;img.src=F.src}
  /* la zona que nunca puede quedar afuera: la página y la llama */
  const r=recorte(w,h,F.w,F.h,{x0:F.pagina.x0-.03,y0:Math.max(0,F.llama.y-.03),x1:F.pagina.x1+.03,y1:F.pagina.y1});
  img.style.width=F.w+'px';img.style.height=F.h+'px';img.style.transform=`translate(${r.x.toFixed(2)}px,${r.y.toFixed(2)}px) scale(${r.escala.toFixed(5)})`;
  const px=r.x+F.pagina.x0*r.ancho,py=r.y+F.pagina.y0*r.alto,pw=(F.pagina.x1-F.pagina.x0)*r.ancho,ph=(F.pagina.y1-F.pagina.y0)*r.alto;
  hoja.style.cssText=`left:${px.toFixed(1)}px;top:${py.toFixed(1)}px;width:${pw.toFixed(1)}px;height:${Math.min(ph,h-py).toFixed(1)}px;--u:${(pw/100).toFixed(3)}px`;
  /* el mismo papel, adentro de la hoja y calzado al píxel con el de atrás */
  tinta.style.backgroundImage=`url(${F.src})`;tinta.style.backgroundSize=`${r.ancho.toFixed(2)}px ${r.alto.toFixed(2)}px`;tinta.style.backgroundPosition=`${(r.x-px).toFixed(2)}px ${(r.y-py).toFixed(2)}px`;
  luz.style.left=(r.x+F.llama.x*r.ancho).toFixed(1)+'px';luz.style.top=(r.y+F.llama.y*r.alto).toFixed(1)+'px';luz.style.setProperty('--r',(r.ancho/22).toFixed(1));
}
if(Q.get('captura'))raiz.dataset.captura='1';
const monto=document.getElementById('monto');let grande=Q.get('monto')==='6767';
const pintar=()=>{monto.innerHTML='<span class="peso">$</span>'+(grande?'6.767':'967')};pintar();
document.querySelector('.probar').addEventListener('click',e=>{if(e.target.closest('button')){grande=!grande;pintar()}});
addEventListener('resize',acomodar);addEventListener('orientationchange',()=>setTimeout(acomodar,60));
acomodar();
/* para comprobar en las capturas que se ve la letra correcta y no una de reemplazo */
document.fonts.ready.then(()=>{window.__fuentes={charm400:document.fonts.check("400 20px Charm"),charm700:document.fonts.check("700 20px Charm")};document.body.classList.add('lista')});
</script>
</body>
